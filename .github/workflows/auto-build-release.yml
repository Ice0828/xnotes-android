name: Upstream Sync & Auto Release

on:
  schedule:
    - cron: '0 0 * * 1' # 每周一定时检查并构建最新上游代码
  workflow_dispatch:      # 支持随时在 GitHub 网页上点击一键构建

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream master and merge rotation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/shardulvs/xnotes-android.git || true
          git fetch upstream master
          git fetch origin fix/rotation-ink-lag
          # 基于上游最新 master 分支创建构建工作分支
          git checkout -B release-build upstream/master
          # 自动合入旋转修复补丁
          git merge origin/fix/rotation-ink-lag -m "Merge rotation fix into upstream master"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK, NDK and CMake
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Configure Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || 'xnotesrelease' }}
          KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS || 'xnotes' }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is not set in repository secrets! Please configure it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          # 去除网页复制可能混入的换行符 \n、回车符 \r 以及前后空格，并开启 -i 忽略干扰字符
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -di > release.keystore
          echo "storeFile=../release.keystore" > keystore.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
          echo "keyAlias=$KEYSTORE_ALIAS" >> keystore.properties
          echo "keyPassword=$KEYSTORE_PASSWORD" >> keystore.properties

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Determine Version Name
        id: get_version
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | head -1 | cut -d '"' -f2)
          UPSTREAM_HASH=$(git rev-parse --short upstream/master)
          echo "version=${VERSION_NAME}-${UPSTREAM_HASH}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION_NAME}-build.${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "upstream_hash=${UPSTREAM_HASH}" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "xnotes ${{ steps.get_version.outputs.version }} (with rotation fix)"
          body: |
            Automated Release Build for xnotes-android.
            
            - **Upstream commit**: ${{ steps.get_version.outputs.upstream_hash }}
            - **Includes fix**: Physical scanout rotation fallback for front-buffered inking.
            - **Signature**: Consistent release keystore (supports in-place updates).
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
